<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Attendance System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>
    
</head>
<body>

<div id="typing" style="color: black; font-weight: 800; font-size: 23px; text-align: center; position: absolute;top: 10px;"></div>

<div class="main-wrapper" data-aos="zoom-in">
    
    <div class="marquee-container">
        <marquee behavior="scroll" direction="left" scrollamount="5">
            <span class="text-secondary"><a style="text-decoration: none;" href="https://www.wscubetech.com/jaipur">🎯 WsCube Career School - Jaipur, Rajasthan - Live Attendance System 🎯 </a></span>
        </marquee>
    </div>
    
    <h2 class="main-title">
        <i class="fas fa-fingerprint"></i> Smart Attendance
    </h2>
    
    <div id="loginSection" data-aos="fade-up" data-aos-delay="100">
        <input type="text" id="regInput" placeholder="Enter Your ID" class="form-control-custom">
        
        <button onclick="saveAndProceed()" class="btn-custom btn-primary-custom mb-3">
            <i class="fas fa-sign-in-alt"></i> Login
        </button>
        
        <a id="createAccountWrapper" href="https://sunildhawan12.github.io/addStudents/" class="d-block">
            <button class="btn-custom btn-accent-custom">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </a>
    </div>

    <div id="attendanceSection" style="display: none;" data-aos="fade-up" data-aos-delay="200">
        <p id="statusMsg">📡 Checking location...</p>
        
        <div class="btn-row mb-3">
            <button id="outBtn" class="out-btn-main" onclick="manualOut()">
                <span class="circle red-circle"></span> OUT
            </button>
        </div>
        
        <button class="btn-custom btn-success-custom" onclick="showHistory()">
            <i class="fas fa-history"></i> Show History
        </button>
    </div>

    <a href="https://sunildhawan12.github.io/Adimn-p/" class="d-block">
        <button class="btn-custom btn-admin-custom">
            <i class="fas fa-lock"></i> 🛠 Admin Panel
        </button>
    </a>
    
    <div id="loaderMsg" class="mt-3 text-center text-muted"></div>
    
    <div id="historyModal" style="
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.7);
        justify-content: center;
        align-items: center;
        z-index: 9999;
    ">
        <div class="modal-content-custom" data-aos="zoom-in">
            <h3 class="modal-title-custom text-center mb-4">
                <i class="fas fa-calendar-alt"></i> Attendance History
            </h3>

            <div class="date-filter-wrapper">
                <label for="filterDate">DATE:</label>
                <input type="text" id="filterDate" placeholder="DD/MM/YYYY" 
                       onfocus="changeToDate(this)" 
                       onblur="restoreTextType(this)" 
                       onchange="renderHistoryTable(historyData)"
                       class="form-control" style="width: auto;">
            </div>

            <div id="historySection">
                <table id="historyTable" class="table table-striped table-bordered mb-0">
                    <thead>
                        <tr>
                            <th>Name/Phone</th>
                            <th>📅 Date</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        </tbody>
                </table>
            </div>

            <div class="modal-footer-actions">
                <button onclick="downloadHistoryPDF()" class="btn-modal-action btn-success-custom">
                    <i class="fas fa-download"></i> Download PDF
                </button>
                <button onclick="document.getElementById('historyModal').style.display='none'" class="btn-modal-action btn-danger-custom">
                    Close
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script src="script.js"></script>
</body>
</html>
